{% extends "base.html" %}
{% block content %}
<div class="card">
    <h1>👤 Manage Admins</h1>
    <a href="{{ url_for('admin_dashboard') }}" class="btn" style="background:#a0aec0;">← Back</a>
</div>
<div class="grid" style="grid-template-columns: 1fr 1fr;">
    <div class="card">
        <h2>Create Admin</h2>
        <form method="POST">
            <input type="hidden" name="action" value="create">
            <div class="form-group"><label>Username</label><input type="text" name="username" required></div>
            <div class="form-group"><label>Password</label><input type="text" name="password" required></div>
            <button type="submit" class="btn btn-block btn-success">Create</button>
        </form>
    </div>
    <div class="card">
        <h2>Existing ({{ admins|length }})</h2>
        <table>
            <tr><th>ID</th><th>Username</th><th>Action</th></tr>
            {% for a in admins %}
            <tr><td>{{ a.id }}</td><td>{{ a.username }}</td>
                <td>{% if a.id == session.get('admin_id') %}<span style="color:#a0aec0;">(you)</span>
                {% else %}
                <form method="POST" style="display:inline;" onsubmit="return confirm('Delete?');">
                    <input type="hidden" name="action" value="delete"><input type="hidden" name="admin_id" value="{{ a.id }}">
                    <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                </form>{% endif %}</td></tr>
            {% endfor %}
        </table>
    </div>
</div>
{% endblock %}
